set timeout=1
set default=0

# Force a 32-bit linear framebuffer mode. Without this, GRUB may pick an
# 8/16-bit or text mode on some hypervisors (notably VirtualBox), and the
# kernel will silently fall back to VGA text mode.
insmod all_video
set gfxmode=1024x768x32,1024x768x24,800x600x32
set gfxpayload=1024x768x32,1024x768x24,800x600x32,auto
terminal_output gfxterm

menuentry "KryspinOS" {
    multiboot /boot/kernel.bin
    boot
}

menuentry "KryspinOS (safe text mode)" {
    set gfxpayload=text
    multiboot /boot/kernel.bin
    boot
}